name: Validar site

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 jinja2 pillow
      - run: python scripts/build.py
      - run: python scripts/validate.py

      - name: Atualizar páginas geradas no ramo principal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/
          if git diff --cached --quiet; then
            echo "As páginas geradas já estão atualizadas."
          else
            git commit -m "Atualiza páginas do catálogo a partir dos dados"
            git push
          fi
